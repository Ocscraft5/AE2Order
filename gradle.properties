# ============================================================
# 依赖版本 —— 下列值均为本机实测可用值（运行环境已验证）
# 如何自己复查：
#   Forge : https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml
#   AE2   : https://modmaven.dev/appeng/appliedenergistics2-forge/maven-metadata.xml
#   JEI   : https://maven.blamejared.com/mezz/jei/jei-1.19.2-forge/maven-metadata.xml
#   AE2WT : https://api.modrinth.com/v2/project/applied-energistics-2-wireless-terminals/version
#           （取 game_versions 含 1.19.2 且 loaders 含 forge 的条目 id 字段）
# ============================================================

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---- Minecraft / Forge ----
minecraft_version=1.19.2
forge_version=43.5.1
minecraft_version_range=[1.19.2,1.19.3)
forge_version_range=[43,)
loader_version_range=[43,)

# ---- Mappings ----
mapping_channel=official
mapping_version=1.19.2

# ---- Mod metadata ----
# 命名空间随之改为 ae2order：模组 id、资源命名空间（assets/ae2order）、网络通道（ae2order:main）、
#   Java 包（com.xiadan.ae2order）全部统一，不再出现旧的 xiadan 命名。
# 许可证：本模组自身代码采用 LGPL-3.0-or-later（与 AE2 一致，见 LICENSE / THIRD-PARTY-NOTICES.md）
mod_id=ae2order
mod_name=AE2 Order Helper
mod_license=LGPL-3.0-or-later
mod_version=0.1.0
mod_group_id=com.xiadan.ae2order
mod_authors=xiadan
# 注意：mods.toml 里的 displayName / description 已直接写在资源文件里（中文用 TOML \uXXXX 转义），
#   下面两个属性仅保留给 processResources 的替换表使用。
mod_description=Middle-click a JEI bookmark or item-list entry to open AE2's craft-amount screen for that network.

# ---- AE2（编译 + 运行可见）----
ae2_version=12.8.4
ae2_version_range=[12.8.4,13.0.0)

# ---- JEI（编译 + 运行可见，客户端）----
# 编译期版本：本机实测可用值。运行期不锁死，见下方 jei_version_range。
jei_version=11.68.0.1085
# 兼容 1.19.2 线全部 JEI 版本：实测 1.19.2-forge 的 maven-metadata 共 99 个版本，
# 采样 18 个（最早 11.2.0.246 → 最新 11.68.0.1085）逐版 javap 校验，
# 本模组用到的 7 个 JEI 公开 API 成员全部存在（IJeiRuntime#getBookmarkOverlay/
# getIngredientListOverlay、IBookmarkOverlay#getItemStackUnderMouse/getIngredientUnderMouse、
# IIngredientListOverlay#getIngredientUnderMouse/isListDisplayed、ITypedIngredient#getIngredient/getType、
# VanillaTypes#ITEM_STACK、IModPlugin#onRuntimeAvailable、@JeiPlugin）。
# 注意：maven-metadata 里 11.8.1.1030 与 11.66.0.1081 在仓库中实际为 404（空壳版本），已排除。
jei_version_range=[11.2.0,12)

# ---- 无线终端库（运行期 + 编译期，无线终端功能必需）----
ae2wt_source=modrinth
ae2wt_modrinth_version_id=Sk6tHeLM
ae2wt_version_range=[12.9.0,13.0.0)
ae2wt_curse_slug=ae2wtlib
ae2wt_curse_file_id=【待填：CurseForge file id】
ae2wt_libs_name=【待填：libs/ 下 jar 的文件名（不含 .jar）】

# ---- 无线终端库的强制前置（仅当把无线终端库放进 run/mods 时才需要）----
cloth_config_version=8.3.134
architectury_version=6.5.90
curios_version=1.19.2-5.1.6.4

# ---- JEI 运行期开关 ----
itemListMod=jei
